<!DOCTYPE html>
<html lang="nl">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=0.35">
    <title>Contact - Pressures Pro</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#fff; text-align: center; color: #000; padding-top: 50px; position: relative; }

        /* Terug-pijl naar de hoofdpagina */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 3.5em;
            color: #0047FF;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        /* Navigatie rechtsboven */
        nav { position:absolute; top:15px; right:15px; }
        nav a { color:black; text-decoration:none; margin-left:15px; font-weight: 500; font-size: 1.1em; }

        .container { max-width: 600px; margin: 80px auto; padding: 20px; }
        h1 { font-size: 3.5em; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .intro { font-size: 1.2em; color: #333; margin-bottom: 40px; line-height: 1.6; }

        .contact-info { text-align: left; display: inline-block; margin-bottom: 40px; }
        .info-row { display: flex; align-items: center; margin-bottom: 20px; font-size: 1.3em; font-weight: 600; }
        
        .icon {
            width: 45px; height: 45px; background: #0047FF; color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; margin-right: 20px;
        }

        /* De vernieuwde Gmail knop */
        .btn-gmail {
            background: #0047FF; 
            color: white; 
            border: none;
            padding: 20px 60px; 
            font-size: 1.3em; 
            font-weight: 700;
            border-radius: 12px; 
            cursor: pointer; 
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn-gmail:hover { background: #0036cc; }
    </style>
</head>
<body>

<a href="index.html" class="back-arrow">←</a>

<div class="container">
    <h1>CONTACT</h1>
    <p class="intro">Neem gerust contact met ons op voor meer informatie over onze industriële schoonmaakdiensten.</p>

    <div class="contact-info">
        <div class="info-row"><div class="icon">📍</div> België</div>
        <div class="info-row"><div class="icon">📞</div> +32 484 83 74 38</div>
        <div class="info-row"><div class="icon">✉️</div> info@pressurespro.be</div>
    </div>

    <br>
    <a href="mailto:info@pressurespro.be" class="btn-gmail">E-mail ons</a>
</div>

</body>
</html>
