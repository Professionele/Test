<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=0.35">
    <title>Contact - Pressures Pro</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#fff; text-align: center; color: #000; padding-top: 50px; position: relative; }

        .back-arrow {
            position: absolute;
            top: 20px; left: 25px;
            font-size: 3em; color: #0047FF;
            text-decoration: none; font-weight: bold;
        }

        nav { position:absolute; top:15px; right:15px; }
        nav a { color:black; text-decoration:none; margin-left:15px; font-weight: 500; }

        .container { max-width: 600px; margin: 80px auto; padding: 20px; }
        h1 { font-size: 3.5em; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .intro { font-size: 1.2em; color: #333; margin-bottom: 40px; }

        .contact-info { text-align: left; display: inline-block; margin-bottom: 40px; }
        .info-row { display: flex; align-items: center; margin-bottom: 20px; font-size: 1.3em; font-weight: 600; }
        
        .icon {
            width: 40px; height: 40px; background: #0047FF; color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; margin-right: 20px;
        }

        /* Formspree knop */
        .btn-verzenden {
            background: #0047FF; color: white; border: none;
            padding: 18px 60px; font-size: 1.2em; font-weight: 600;
            border-radius: 10px; cursor: pointer; text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-arrow">←</a>

<nav>
    <a href="index.html">Diensten</a>
    <a href="#">Over Ons</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h1>CONTACT</h1>
    <p class="intro">Neem gerust contact met ons op voor meer informatie over onze industriële schoonmaakdiensten.</p>

    <div class="contact-info">
        <div class="info-row"><div class="icon">📍</div> België</div>
        <div class="info-row"><div class="icon">📞</div> +32 (Vul nummer in)</div>
        <div class="info-row"><div class="icon">✉️</div> info@pressurespro.be</div>
    </div>

    <form action="https://formspree.io/f/mdaljekl" method="POST">
        <input type="hidden" name="_subject" value="Nieuw bericht van website">
        <button type="submit" class="btn-verzenden">Klik hier om te mailen</button>
    </form>
</div>

</body>
</html>
